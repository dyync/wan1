name: wan22

services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /shared_media
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8000}:8000"
    volumes:
      - ./shared_media:/shared_media:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /shared_media
      CKPT_DIR: /models/Wan2.2-TI2V-5B
      HF_HOME: /models/hf-cache
    volumes:
      - ./shared_media:/shared_media
      - wan_models:/models
    # offload_model + t5_cpu move weights to host RAM; Docker's default 64MB /dev/shm is too small for torch.
    shm_size: "16gb"
    init: true
    stop_grace_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  redis_data:
  wan_models:
